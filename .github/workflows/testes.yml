name: Testes Marco 3

on:
  push:
    branches: [main]
    paths:
      - "marco3/api/**"
      - "marco3/testes/**"
      - ".github/workflows/testes.yml"
  pull_request:
    paths:
      - "marco3/api/**"
      - "marco3/testes/**"
      - ".github/workflows/testes.yml"

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]   # o guia pede Python 3.10+

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: marco3/api/requirements*.txt

      - name: Instalar dependências
        run: pip install -r marco3/api/requirements-test.txt

      - name: Rodar testes
        working-directory: marco3/testes
        run: >
          python -m unittest -v
          test_regra
          test_api
          test_melhorias
          test_consolidacao.TestarPersistenciaIntegrada