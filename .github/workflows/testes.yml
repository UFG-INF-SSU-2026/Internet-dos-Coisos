name: Testes Marco 4

on:
  push:
    branches: [main]
    paths:
      - "marco4/api/**"
      - "marco4/mobile/**"
      - "marco4/testes/**"
      - ".github/workflows/testes.yml"
  pull_request:
    paths:
      - "marco4/api/**"
      - "marco4/mobile/**"
      - "marco4/testes/**"
      - ".github/workflows/testes.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    services:
      timescaledb:
        image: timescale/timescaledb:latest-pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: coisos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d coisos_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/coisos_test
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]   # o guia pede Python 3.10+

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: marco4/api/requirements*.txt

      - name: Instalar dependências
        run: |
          pip install -r marco4/api/requirements-test.txt
          pip install -r marco4/api/requirements-temporal.txt

      # Todos os módulos, inclusive TestarCredenciaisPrivadas (gerar_config em
      # pasta temporária) e os testes do app (token, leitura atrasada, contexto).
      # O pytest roda os testes unittest sem mudança e gera o relatório JUnit.
      - name: Rodar testes
        working-directory: marco4/testes
        run: >
          python -m pytest -v
          --junitxml=relatorio-junit-py${{ matrix.python-version }}.xml
          test_regra.py
          test_api.py
          test_melhorias.py
          test_consolidacao.py
          test_app_mobile.py
          test_temporal_real.py

      - name: Guardar relatório JUnit (evidência)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-junit-py${{ matrix.python-version }}
          path: marco4/testes/relatorio-junit-py${{ matrix.python-version }}.xml
          retention-days: 90

  # Testes de unidade do app Android na JVM (sem emulador) e o APK debug.
  app-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: marco4/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # O padrão da action instala o pacote "tools", que não existe mais no SDK.
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-37.0 build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Testes de unidade e APK
        run: ./gradlew testDebugUnitTest assembleDebug --console=plain

      # Sem isto o emulador recusa iniciar ("A hardware CPU accelerator is required"):
      # os runners Linux têm KVM, mas o dispositivo vem sem permissão para o usuário.
      - name: Liberar KVM para o emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Testes instrumentados Compose no emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: cd marco4/mobile && ./gradlew connectedDebugAndroidTest --console=plain

      - name: Guardar relatório instrumentado do app
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-instrumentado-app
          path: marco4/mobile/app/build/outputs/androidTest-results/connected/*.xml
          retention-days: 90

      - name: Guardar relatório JUnit do app (evidência)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-junit-app
          path: marco4/mobile/app/build/test-results/testDebugUnitTest/*.xml
          retention-days: 90

      - name: Guardar APK gerado pelo CI
        uses: actions/upload-artifact@v4
        with:
          name: coisos-cuidador-debug-apk
          path: marco4/mobile/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
