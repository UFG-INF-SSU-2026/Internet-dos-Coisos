name: Testes Marco 4

on:
  push:
    branches: [main]
    paths:
      - "marco4/api/**"
      - "marco4/mobile/**"
      - "marco4/testes/**"
      - ".github/workflows/testes.yml"
  pull_request:
    paths:
      - "marco4/api/**"
      - "marco4/mobile/**"
      - "marco4/testes/**"
      - ".github/workflows/testes.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]   # o guia pede Python 3.10+

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: marco4/api/requirements*.txt

      - name: Instalar dependências
        run: pip install -r marco4/api/requirements-test.txt

      # Todos os módulos, inclusive TestarCredenciaisPrivadas (gerar_config em
      # pasta temporária) e os testes do app (token, leitura atrasada, contexto).
      # O pytest roda os testes unittest sem mudança e gera o relatório JUnit.
      - name: Rodar testes
        working-directory: marco4/testes
        run: >
          python -m pytest -v
          --junitxml=relatorio-junit-py${{ matrix.python-version }}.xml
          test_regra.py
          test_api.py
          test_melhorias.py
          test_consolidacao.py
          test_app_mobile.py

      - name: Guardar relatório JUnit (evidência)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-junit-py${{ matrix.python-version }}
          path: marco4/testes/relatorio-junit-py${{ matrix.python-version }}.xml
          retention-days: 90

  # Testes de unidade do app Android na JVM (sem emulador) e o APK debug.
  app-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: marco4/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: SDK Platform 37
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Testes de unidade e APK
        run: ./gradlew testDebugUnitTest assembleDebug --console=plain

      - name: Guardar relatório JUnit do app (evidência)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-junit-app
          path: marco4/mobile/app/build/test-results/testDebugUnitTest/*.xml
          retention-days: 90

      - name: Guardar APK gerado pelo CI
        uses: actions/upload-artifact@v4
        with:
          name: coisos-cuidador-debug-apk
          path: marco4/mobile/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
