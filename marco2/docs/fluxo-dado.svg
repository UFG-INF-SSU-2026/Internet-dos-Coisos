<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1170" width="1400" height="1170" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#37474f"/>
    </marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#e65100"/>
    </marker>
    <style>
      .h1   { font-size: 26px; font-weight: bold; fill: #16202a; }
      .sub  { font-size: 14px; fill: #607d8b; }
      .role { font-size: 17px; font-weight: bold; letter-spacing: 1px; }
      .st   { font-size: 15px; font-weight: bold; fill: #16202a; }
      .cap  { font-size: 13.5px; fill: #37474f; }
      .tiny { font-size: 11.5px; fill: #78909c; }
      .lbl  { font-size: 12.5px; font-weight: bold; fill: #37474f; }
      .mono { font-family: "DejaVu Sans Mono", Consolas, monospace; font-size: 12px; fill: #37474f; }
      .flow { stroke: #37474f; stroke-width: 2.2; fill: none; marker-end: url(#a); }
      .fila { stroke: #e65100; stroke-width: 2.2; fill: none; stroke-dasharray: 7 5; marker-end: url(#ao); }
      .box  { fill: #ffffff; stroke: #90caf9; stroke-width: 1.6; }
      .cbox { fill: #ffffff; stroke: #a5d6a7; stroke-width: 1.6; }
      .dia  { fill: #fffde7; stroke: #fbc02d; stroke-width: 1.8; }
      .num  { font-size: 13px; font-weight: bold; fill: #ffffff; }
    </style>
  </defs>

  <rect width="1400" height="1170" fill="#ffffff"/>

  <text x="40" y="52" class="h1">Caminho do dado: da leitura ao alerta</text>
  <text x="40" y="76" class="sub">O ESP32 lê, acumula e decide; só a mudança de estado atravessa a rede. Tudo fica em memória volátil.</text>

  <!-- ================== PRODUTOR ================== -->
  <rect x="40" y="105" width="730" height="1030" rx="14" fill="#f3f8fc" stroke="#bbdefb" stroke-width="2"/>
  <text x="64" y="137" class="role" fill="#1565c0">PRODUTOR</text>
  <text x="64" y="156" class="tiny">ESP32 no Wokwi · toda a decisão acontece aqui</text>
  <rect x="80" y="180" width="340" height="100" rx="10" class="box"/>
  <circle cx="102" cy="204" r="12" fill="#1565c0"/>
  <text x="102" y="208.5" class="num" text-anchor="middle">1</text>
  <text x="124" y="209" class="st">Leitura a cada 1 s</text>
  <text x="102" y="234" class="cap">potenciômetro (FC) + MPU6050 (movimento)</text>
  <rect x="102" y="250" width="40" height="20" rx="10" fill="#66bb6a"/>
  <text x="122.0" y="264" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">OK</text>
  <rect x="150" y="250" width="118" height="20" rx="10" fill="#ffa726"/>
  <text x="209.0" y="264" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">FORA_DE_FAIXA</text>
  <rect x="276" y="250" width="66" height="20" rx="10" fill="#b0bec5"/>
  <text x="309.0" y="264" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">AUSENTE</text>
  <line x1="250" y1="280" x2="250" y2="306" class="flow"/>
  <rect x="80" y="310" width="340" height="118" rx="10" class="box"/>
  <circle cx="102" cy="334" r="12" fill="#1565c0"/>
  <text x="102" y="338.5" class="num" text-anchor="middle">2</text>
  <text x="124" y="339" class="st">Janela circular</text>
  <text x="102" y="362" class="cap">FC: últimas 20 · mov.: últimas 10 · sobrescreve</text>
  <rect x="102" y="376" width="13" height="20" rx="2" fill="#66bb6a"/>
  <rect x="117" y="376" width="13" height="20" rx="2" fill="#66bb6a"/>
  <rect x="132" y="376" width="13" height="20" rx="2" fill="#66bb6a"/>
  <rect x="147" y="376" width="13" height="20" rx="2" fill="#cfd8dc"/>
  <rect x="162" y="376" width="13" height="20" rx="2" fill="#66bb6a"/>
  <rect x="177" y="376" width="13" height="20" rx="2" fill="#66bb6a"/>
  <rect x="192" y="376" width="13" height="20" rx="2" fill="#66bb6a"/>
  <rect x="207" y="376" width="13" height="20" rx="2" fill="#66bb6a"/>
  <rect x="222" y="376" width="13" height="20" rx="2" fill="#66bb6a"/>
  <rect x="237" y="376" width="13" height="20" rx="2" fill="#cfd8dc"/>
  <rect x="252" y="376" width="13" height="20" rx="2" fill="#cfd8dc"/>
  <rect x="267" y="376" width="13" height="20" rx="2" fill="#66bb6a"/>
  <rect x="282" y="376" width="13" height="20" rx="2" fill="#66bb6a"/>
  <rect x="297" y="376" width="13" height="20" rx="2" fill="#66bb6a"/>
  <rect x="312" y="376" width="13" height="20" rx="2" fill="#66bb6a"/>
  <rect x="327" y="376" width="13" height="20" rx="2" fill="#cfd8dc"/>
  <rect x="342" y="376" width="13" height="20" rx="2" fill="#66bb6a"/>
  <rect x="357" y="376" width="13" height="20" rx="2" fill="#66bb6a"/>
  <rect x="372" y="376" width="13" height="20" rx="2" fill="#66bb6a"/>
  <rect x="387" y="376" width="13" height="20" rx="2" fill="#66bb6a"/>
  <text x="102" y="416" class="tiny">16 de 20 válidas → cobertura 0,80</text>
  <line x1="250" y1="428" x2="250" y2="451" class="flow"/>
  <text x="260" y="445" class="tiny">a cada 5 s</text>
  <path d="M250 455 L375 505 L250 555 L125 505 z" class="dia"/>
  <text x="250" y="502" class="st" text-anchor="middle">cobertura ≥ 70%?</text>
  <text x="250" y="520" class="tiny" text-anchor="middle">FC e movimento</text>
  <path d="M375 505 H466" class="flow"/>
  <text x="390" y="497" class="lbl">não</text>
  <line x1="250" y1="555" x2="250" y2="581" class="flow"/>
  <text x="260" y="574" class="lbl">sim</text>
  <rect x="470" y="465" width="270" height="80" rx="10" fill="#e3f2fd" stroke="#1e88e5" stroke-width="1.6"/>
  <text x="490" y="490" class="st" fill="#1565c0">DADOS_INSUFICIENTES</text>
  <text x="490" y="511" class="cap">imediato · LED azul</text>
  <text x="490" y="530" class="tiny">buzzer mantido: só NORMAL desliga o alerta</text>
  <path d="M605 545 V673 H254" class="flow"/>
  <rect x="80" y="585" width="340" height="80" rx="10" class="box"/>
  <circle cx="102" cy="609" r="12" fill="#1565c0"/>
  <text x="102" y="613.5" class="num" text-anchor="middle">3</text>
  <text x="124" y="614" class="st">Regra + persistência</text>
  <text x="102" y="638" class="cap">entra: FC &gt; 100 em repouso, 2 avaliações</text>
  <text x="102" y="656" class="tiny">sai: FC ≤ 92 · mínimo de 10 s em cada estado</text>
  <line x1="250" y1="665" x2="250" y2="681" class="flow"/>
  <path d="M250 685 L365 735 L250 785 L135 735 z" class="dia"/>
  <text x="250" y="740" class="st" text-anchor="middle">mudou o estado?</text>
  <path d="M365 735 H466" class="flow"/>
  <text x="380" y="727" class="lbl">não</text>
  <rect x="470" y="702" width="270" height="66" rx="10" fill="#f5f5f5" stroke="#cfd8dc" stroke-width="1.6"/>
  <text x="490" y="728" class="st" fill="#607d8b">nada é publicado</text>
  <text x="490" y="750" class="tiny">amostras brutas nunca saem do ESP32</text>
  <line x1="250" y1="785" x2="250" y2="811" class="flow"/>
  <text x="260" y="804" class="lbl">sim</text>
  <rect x="80" y="815" width="340" height="78" rx="10" class="box"/>
  <circle cx="102" cy="839" r="12" fill="#1565c0"/>
  <text x="102" y="843.5" class="num" text-anchor="middle">4</text>
  <text x="124" y="844" class="st">Evento JSON · sequence + 1</text>
  <text x="102" y="866" class="cap">LED e buzzer mudam na hora, com ou sem rede</text>
  <text x="102" y="883" class="tiny">leva estado, média, coberturas e razão</text>
  <line x1="250" y1="893" x2="250" y2="913" class="flow"/>
  <path d="M250 915 L360 960 L250 1005 L140 960 z" class="dia"/>
  <text x="250" y="965" class="st" text-anchor="middle">publish ok?</text>
  <path d="M360 960 H796" class="flow"/>
  <text x="375" y="951" class="lbl">sim</text>
  <text x="410" y="951" class="tiny">publica em .../state</text>
  <line x1="250" y1="1005" x2="250" y2="1031" class="fila"/>
  <text x="260" y="1023" class="lbl" fill="#e65100">não</text>
  <text x="290" y="1023" class="tiny">sem rede ou falha simulada</text>
  <rect x="80" y="1035" width="420" height="82" rx="10" fill="#fff3e0" stroke="#ffb74d" stroke-width="1.6"/>
  <text x="102" y="1059" class="st" fill="#e65100">Fila local · 12 eventos</text>
  <text x="280" y="1059" class="tiny">guarda eventos, não amostras</text>
  <rect x="102" y="1070" width="23" height="20" rx="3" fill="#ffb74d" stroke="#ffb74d"/>
  <rect x="129" y="1070" width="23" height="20" rx="3" fill="#ffb74d" stroke="#ffb74d"/>
  <rect x="156" y="1070" width="23" height="20" rx="3" fill="#ffb74d" stroke="#ffb74d"/>
  <rect x="183" y="1070" width="23" height="20" rx="3" fill="#ffffff" stroke="#ffb74d"/>
  <rect x="210" y="1070" width="23" height="20" rx="3" fill="#ffffff" stroke="#ffb74d"/>
  <rect x="237" y="1070" width="23" height="20" rx="3" fill="#ffffff" stroke="#ffb74d"/>
  <rect x="264" y="1070" width="23" height="20" rx="3" fill="#ffffff" stroke="#ffb74d"/>
  <rect x="291" y="1070" width="23" height="20" rx="3" fill="#ffffff" stroke="#ffb74d"/>
  <rect x="318" y="1070" width="23" height="20" rx="3" fill="#ffffff" stroke="#ffb74d"/>
  <rect x="345" y="1070" width="23" height="20" rx="3" fill="#ffffff" stroke="#ffb74d"/>
  <rect x="372" y="1070" width="23" height="20" rx="3" fill="#ffffff" stroke="#ffb74d"/>
  <rect x="399" y="1070" width="23" height="20" rx="3" fill="#ffffff" stroke="#ffb74d"/>
  <text x="102" y="1108" class="tiny">FIFO · cheia, descarta o mais antigo (o consumidor vê salto no sequence)</text>
  <path d="M500 1076 H796" class="fila"/>
  <text x="520" y="1066" class="lbl" fill="#e65100">na reconexão</text>
  <text x="520" y="1094" class="tiny">reenvia em ordem</text>
  <!-- ================== BROKER ================== -->
  <rect x="800" y="905" width="200" height="200" rx="14" fill="#fff8e1" stroke="#ffcc80" stroke-width="2"/>
  <text x="820" y="935" class="role" fill="#e65100">BROKER</text>
  <text x="820" y="954" class="tiny">broker.hivemq.com</text>
  <text x="820" y="985" class="mono">.../state</text>
  <text x="820" y="1001" class="tiny">repassa, não guarda</text>
  <text x="820" y="1032" class="mono">.../status</text>
  <text x="820" y="1048" class="tiny">retém online/offline</text>
  <text x="820" y="1064" class="tiny">publica o last will</text>
  <text x="820" y="1080" class="tiny">se o ESP32 sumir</text>
  <path d="M1000 960 H1020 V700 H1056" class="flow"/>
  <!-- ================== CONSUMIDOR ================== -->
  <rect x="1040" y="600" width="330" height="535" rx="14" fill="#f1f8f1" stroke="#c8e6c9" stroke-width="2"/>
  <text x="1060" y="632" class="role" fill="#2e7d32">CONSUMIDOR</text>
  <text x="1060" y="651" class="tiny">serviço Python · não recalcula nada</text>
  <rect x="1060" y="670" width="290" height="76" rx="10" class="cbox"/>
  <circle cx="1082" cy="694" r="12" fill="#2e7d32"/>
  <text x="1082" y="698.5" class="num" text-anchor="middle">1</text>
  <text x="1104" y="699" class="st">Valida o contrato</text>
  <text x="1082" y="721" class="cap">JSON, campos, schemaVersion</text>
  <text x="1082" y="738" class="tiny">falhou: REJEITADO</text>
  <line x1="1205" y1="746" x2="1205" y2="768" class="flow"/>
  <rect x="1060" y="772" width="290" height="76" rx="10" class="cbox"/>
  <circle cx="1082" cy="796" r="12" fill="#2e7d32"/>
  <text x="1082" y="800.5" class="num" text-anchor="middle">2</text>
  <text x="1104" y="801" class="st">Deduplica</text>
  <text x="1082" y="823" class="cap">eventId já visto: descarta</text>
  <line x1="1205" y1="848" x2="1205" y2="870" class="flow"/>
  <rect x="1060" y="874" width="290" height="76" rx="10" class="cbox"/>
  <circle cx="1082" cy="898" r="12" fill="#2e7d32"/>
  <text x="1082" y="902.5" class="num" text-anchor="middle">3</text>
  <text x="1104" y="903" class="st">Confere o sequence</text>
  <text x="1082" y="925" class="cap">pulou: evento perdido</text>
  <text x="1082" y="942" class="tiny">menor: fora de ordem</text>
  <line x1="1205" y1="950" x2="1205" y2="972" class="flow"/>
  <rect x="1060" y="976" width="290" height="76" rx="10" class="cbox"/>
  <circle cx="1082" cy="1000" r="12" fill="#2e7d32"/>
  <text x="1082" y="1004.5" class="num" text-anchor="middle">4</text>
  <text x="1104" y="1005" class="st">Painel + alerta</text>
  <text x="1082" y="1027" class="cap">ATENCAO: alerta ao cuidador</text>
  <text x="1082" y="1044" class="tiny">status: online / offline</text>
  <!-- ================== ARMAZENAMENTO ================== -->
  <rect x="800" y="105" width="570" height="465" rx="14" fill="#fafafa" stroke="#e0e0e0" stroke-width="2"/>
  <text x="824" y="137" class="role" fill="#37474f">ONDE FICA CADA DADO</text>
  <text x="824" y="156" class="tiny">nenhum lado grava em disco</text>
  <rect x="824" y="178" width="6" height="116" rx="3" fill="#1565c0"/>
  <text x="844" y="196" class="st" fill="#1565c0">Produtor</text>
  <text x="928" y="196" class="tiny">RAM do ESP32</text>
  <text x="844" y="220" class="cap">• janelas de FC e movimento</text>
  <text x="844" y="239" class="cap">• estado atual, desde quando, persistência</text>
  <text x="844" y="258" class="cap">• sequence e fila (12 × 320 B ≈ 3,8 KB)</text>
  <text x="844" y="286" class="tiny" font-style="italic">perde tudo ao reiniciar a simulação</text>
  <rect x="824" y="306" width="6" height="116" rx="3" fill="#e65100"/>
  <text x="844" y="324" class="st" fill="#e65100">Broker</text>
  <text x="910" y="324" class="tiny">HiveMQ público</text>
  <text x="844" y="348" class="cap">• último status retido (online/offline)</text>
  <text x="844" y="367" class="cap">• last will registrado na conexão</text>
  <text x="844" y="386" class="cap">• eventos de state: NÃO guarda</text>
  <text x="844" y="414" class="tiny" font-style="italic">consumidor fora do ar perde as transições</text>
  <rect x="824" y="434" width="6" height="116" rx="3" fill="#2e7d32"/>
  <text x="844" y="452" class="st" fill="#2e7d32">Consumidor</text>
  <text x="946" y="452" class="tiny">memória do processo</text>
  <text x="844" y="476" class="cap">• último sequence recebido</text>
  <text x="844" y="495" class="cap">• eventIds já processados</text>
  <text x="844" y="514" class="cap">• estado e disponibilidade exibidos</text>
  <text x="844" y="542" class="tiny" font-style="italic">perde tudo ao encerrar o script</text>
</svg>
