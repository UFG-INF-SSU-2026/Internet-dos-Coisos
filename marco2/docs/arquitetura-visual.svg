<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" width="1400" height="820" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#37474f"/>
    </marker>
    <marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#c62828"/>
    </marker>
    <style>
      .h1   { font-size: 26px; font-weight: bold; fill: #16202a; }
      .sub  { font-size: 14px; fill: #607d8b; }
      .role { font-size: 17px; font-weight: bold; letter-spacing: 1px; }
      .cap  { font-size: 13.5px; fill: #37474f; }
      .tiny { font-size: 11.5px; fill: #78909c; }
      .mono { font-family: "DejaVu Sans Mono", Consolas, monospace; font-size: 12px; fill: #37474f; }
      .flow { stroke: #37474f; stroke-width: 2.4; fill: none; marker-end: url(#a); }
      .fail { stroke: #c62828; stroke-width: 2.2; fill: none; stroke-dasharray: 7 5; marker-end: url(#af); }
      .pin  { fill: #b0bec5; }
    </style>
  </defs>

  <rect width="1400" height="820" fill="#ffffff"/>

  <text x="50" y="52" class="h1">Como os dois componentes conversam</text>
  <text x="50" y="76" class="sub">Grupo Internet das Coisos · smart clothing · o ESP32 decide na borda e publica; o serviço recebe e avisa</text>

  <!-- ================== PRODUTOR ================== -->
  <rect x="50" y="108" width="400" height="430" rx="14" fill="#f3f8fc" stroke="#bbdefb" stroke-width="2"/>
  <text x="74" y="140" class="role" fill="#1565c0">PRODUTOR</text>
  <text x="74" y="160" class="tiny">ESP32 simulado no Wokwi</text>

  <!-- potenciometro -->
  <g transform="translate(96,196)">
    <circle cx="34" cy="34" r="30" fill="#1e88e5"/>
    <circle cx="34" cy="34" r="22" fill="#eceff1"/>
    <line x1="34" y1="34" x2="34" y2="16" stroke="#37474f" stroke-width="3.5" stroke-linecap="round"/>
    <rect x="18" y="64" width="32" height="8" rx="2" fill="#90a4ae"/>
    <text x="34" y="92" class="cap" text-anchor="middle">Batimento</text>
    <text x="34" y="107" class="tiny" text-anchor="middle">entrada substituta</text>
  </g>

  <!-- MPU -->
  <g transform="translate(96,320)">
    <rect x="4" y="6" width="60" height="48" rx="5" fill="#263238"/>
    <rect x="14" y="16" width="40" height="28" rx="3" fill="#455a64"/>
    <text x="34" y="36" font-size="9" fill="#cfd8dc" text-anchor="middle">MPU6050</text>
    <text x="34" y="74" class="cap" text-anchor="middle">Movimento</text>
    <text x="34" y="89" class="tiny" text-anchor="middle">repouso ou esforço</text>
  </g>

  <!-- placa ESP32 -->
  <g transform="translate(236,196)">
    <rect x="0" y="0" width="86" height="186" rx="7" fill="#212b33"/>
    <rect x="-7" y="16" width="10" height="154" rx="2" class="pin"/>
    <rect x="83" y="16" width="10" height="154" rx="2" class="pin"/>
    <rect x="20" y="16" width="46" height="34" rx="3" fill="#b0bec5"/>
    <text x="43" y="38" font-size="9" fill="#37474f" text-anchor="middle">WiFi</text>
    <rect x="26" y="62" width="34" height="30" rx="3" fill="#546e7a"/>
    <text x="43" y="82" font-size="9" fill="#eceff1" text-anchor="middle">ESP32</text>
    <rect x="30" y="160" width="26" height="14" rx="2" fill="#78909c"/>
    <text x="43" y="206" class="cap" text-anchor="middle">Decide na borda</text>
    <text x="43" y="222" class="tiny" text-anchor="middle">janela · histerese · estado</text>
  </g>

  <!-- ligacoes internas -->
  <path class="flow" d="M170 232 L 228 240"/>
  <path class="flow" d="M166 344 L 228 336"/>

  <!-- atuacao local -->
  <g transform="translate(356,214)">
    <circle cx="20" cy="18" r="13" fill="#e53935"/>
    <line x1="14" y1="30" x2="14" y2="44" stroke="#90a4ae" stroke-width="2.5"/>
    <line x1="26" y1="30" x2="26" y2="44" stroke="#90a4ae" stroke-width="2.5"/>
    <circle cx="20" cy="86" r="18" fill="#212b33"/>
    <circle cx="20" cy="86" r="5" fill="#546e7a"/>
    <path d="M42 70 l0 14 M42 70 l8 3" stroke="#37474f" stroke-width="2" fill="none"/>
    <text x="20" y="126" class="cap" text-anchor="middle">Alerta</text>
    <text x="20" y="141" class="tiny" text-anchor="middle">local</text>
  </g>
  <path class="flow" d="M330 250 L 352 236"/>
  <path class="flow" d="M330 292 L 352 296"/>

  <!-- rodape do produtor -->
  <rect x="74" y="452" width="352" height="66" rx="8" fill="#ffffff" stroke="#bbdefb"/>
  <text x="90" y="476" class="cap">Só publica quando o <tspan font-weight="bold">estado muda</tspan>.</text>
  <text x="90" y="496" class="tiny">Não despeja leitura bruta na rede: o que atravessa a fronteira é a decisão.</text>

  <!-- ================== WIFI + SETA ================== -->
  <g transform="translate(470,260)" stroke="#1565c0" fill="none" stroke-width="3" stroke-linecap="round">
    <path d="M6 40 a 22 22 0 0 1 32 0"/>
    <path d="M-4 28 a 38 38 0 0 1 52 0"/>
    <path d="M-14 16 a 54 54 0 0 1 72 0"/>
    <circle cx="22" cy="48" r="4" fill="#1565c0" stroke="none"/>
  </g>
  <path class="flow" d="M462 350 L 556 350"/>
  <text x="470" y="340" class="mono">publish</text>

  <!-- ================== BROKER ================== -->
  <rect x="566" y="108" width="288" height="430" rx="14" fill="#fdf6f1" stroke="#ffccbc" stroke-width="2"/>
  <text x="590" y="140" class="role" fill="#d84315">MQTT</text>
  <text x="590" y="160" class="tiny">broker público · intermediário</text>

  <!-- nuvem -->
  <g transform="translate(600,196)">
    <path d="M52 78 a30 30 0 0 1 4 -59 a34 34 0 0 1 64 -8 a28 28 0 0 1 24 27 a24 24 0 0 1 -6 40 z"
          fill="#ffffff" stroke="#ff7043" stroke-width="2.5"/>
    <text x="106" y="54" font-size="17" font-weight="bold" fill="#d84315" text-anchor="middle">BROKER</text>
  </g>

  <text x="710" y="316" class="cap" text-anchor="middle">Recebe e distribui por tópico</text>
  <text x="710" y="334" class="tiny" text-anchor="middle">o produtor não conhece o destino</text>

  <!-- topicos -->
  <rect x="590" y="356" width="240" height="46" rx="8" fill="#ffffff" stroke="#ffab91"/>
  <text x="604" y="376" class="cap">telemetria — o que aconteceu</text>
  <text x="604" y="393" class="mono">.../state</text>

  <rect x="590" y="412" width="240" height="46" rx="8" fill="#ffffff" stroke="#ffab91"/>
  <text x="604" y="432" class="cap">disponibilidade do aparelho</text>
  <text x="604" y="449" class="mono">.../status</text>

  <rect x="590" y="472" width="240" height="46" rx="8" fill="#fff3ec" stroke="#ffccbc"/>
  <text x="710" y="492" class="tiny" text-anchor="middle">Se o ESP32 sumir, o próprio broker</text>
  <text x="710" y="508" class="tiny" text-anchor="middle">avisa que ele ficou offline.</text>

  <!-- ================== SETA PARA CONSUMIDOR ================== -->
  <path class="flow" d="M862 350 L 950 350"/>
  <text x="868" y="340" class="mono">deliver</text>

  <!-- ================== CONSUMIDOR ================== -->
  <rect x="960" y="108" width="390" height="430" rx="14" fill="#f3faf4" stroke="#c8e6c9" stroke-width="2"/>
  <text x="984" y="140" class="role" fill="#2e7d32">CONSUMIDOR</text>
  <text x="984" y="160" class="tiny">serviço em Python no computador</text>

  <!-- laptop -->
  <g transform="translate(1000,190)">
    <rect x="0" y="0" width="310" height="196" rx="10" fill="#263238"/>
    <rect x="12" y="12" width="286" height="172" rx="6" fill="#0f1a12"/>

    <text x="28" y="40" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#81c784">EVENTO seq=3</text>
    <text x="28" y="60" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#b0bec5">contrato v1 ..... ok</text>
    <text x="28" y="78" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#b0bec5">duplicado ....... nao</text>
    <text x="28" y="96" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#b0bec5">sequencia ....... ok</text>

    <rect x="24" y="112" width="262" height="30" rx="5" fill="#b71c1c"/>
    <text x="155" y="132" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">PACIENTE: ATENCAO</text>

    <text x="28" y="164" font-family="DejaVu Sans Mono, monospace" font-size="11.5" fill="#ffab91">&gt;&gt; alerta ao cuidador</text>

    <rect x="-24" y="196" width="358" height="12" rx="4" fill="#37474f"/>
  </g>

  <text x="1155" y="440" class="cap" text-anchor="middle">Confere o contrato antes de acreditar</text>
  <text x="1155" y="458" class="tiny" text-anchor="middle">versão errada, repetido ou fora de ordem: não passa</text>

  <rect x="984" y="472" width="342" height="46" rx="8" fill="#ffffff" stroke="#c8e6c9"/>
  <text x="1155" y="500" class="cap" text-anchor="middle">O efeito aparece na tela — é o que se vê ao vivo.</text>

  <!-- ================== FALHA ================== -->
  <g transform="translate(150,566)">
    <rect x="0" y="0" width="290" height="86" rx="10" fill="#fff5f5" stroke="#ef9a9a" stroke-width="2"/>
    <g transform="translate(18,22)">
      <rect x="0" y="6" width="14" height="30" rx="2" fill="#ef5350"/>
      <rect x="18" y="6" width="14" height="30" rx="2" fill="#ef5350"/>
      <rect x="36" y="6" width="14" height="30" rx="2" fill="#ffcdd2"/>
    </g>
    <text x="86" y="36" class="cap" fill="#c62828" font-weight="bold">Se a rede cair</text>
    <text x="86" y="56" class="tiny">o ESP32 guarda os eventos na fila</text>
    <text x="86" y="72" class="tiny">e reenvia em ordem quando voltar</text>
  </g>

  <path class="fail" d="M440 596 C 530 596, 548 470, 586 386"/>
  <text x="452" y="640" class="tiny" fill="#c62828">a decisão continua sem rede; só a entrega espera</text>

  <!-- ================== PASSOS ================== -->
  <rect x="50" y="690" width="1300" height="96" rx="12" fill="#f7f9fa" stroke="#cfd8dc"/>
  <text x="74" y="718" class="tiny">O QUE VOCÊS VÃO VER AGORA</text>

  <g font-size="13.5" fill="#37474f">
    <circle cx="92"  cy="752" r="15" fill="#1565c0"/><text x="92"  y="757" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">1</text>
    <text x="116" y="757">o sensor muda</text>

    <circle cx="352" cy="752" r="15" fill="#1565c0"/><text x="352" y="757" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">2</text>
    <text x="376" y="757">o ESP32 decide</text>

    <circle cx="612" cy="752" r="15" fill="#d84315"/><text x="612" y="757" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">3</text>
    <text x="636" y="757">publica no broker</text>

    <circle cx="892" cy="752" r="15" fill="#2e7d32"/><text x="892" y="757" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">4</text>
    <text x="916" y="757">o serviço valida</text>

    <circle cx="1136" cy="752" r="15" fill="#2e7d32"/><text x="1136" y="757" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">5</text>
    <text x="1160" y="757">e avisa o cuidador</text>
  </g>

  <path d="M250 752 L 330 752" stroke="#b0bec5" stroke-width="2" marker-end="url(#a)" fill="none"/>
  <path d="M508 752 L 590 752" stroke="#b0bec5" stroke-width="2" marker-end="url(#a)" fill="none"/>
  <path d="M780 752 L 870 752" stroke="#b0bec5" stroke-width="2" marker-end="url(#a)" fill="none"/>
  <path d="M1044 752 L 1114 752" stroke="#b0bec5" stroke-width="2" marker-end="url(#a)" fill="none"/>
</svg>
