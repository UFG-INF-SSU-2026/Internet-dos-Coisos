; Compila o sketch para o simulador Wokwi do VS Code (wokwi.toml).
; O sketch continua o mesmo do wokwi.com; config.h é local (gerar_config.py).
[platformio]
src_dir = .

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<*.ino> +<*.cpp> -<.pio/>
lib_deps =
    adafruit/Adafruit MPU6050
    adafruit/Adafruit Unified Sensor
    adafruit/Adafruit BusIO
