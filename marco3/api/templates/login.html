<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login | Internet dos Coisos</title>
  <style>
    body {font-family:system-ui,Arial,sans-serif; background:#f1f5f9; color:#172136; margin:0;
          min-height:100vh; display:grid;place-items:center}
    main {background:white;width:min(90vw,380px);border-radius:15px;padding:30px;box-shadow:0 12px 36px #182d4b21}
    h1 {font-size:1.35rem;margin:0 0 6px} p {color:#526079;margin:4px 0 24px}
    label {display:block;font-weight:600;margin:16px 0 5px} input {box-sizing:border-box;width:100%;padding:11px;
          border:1px solid #b7c1ce;border-radius:7px;font-size:1rem}
    button {margin-top:24px;background:#173b72;color:white;border:0;padding:12px;border-radius:8px;
            cursor:pointer;width:100%;font-weight:600;font-size:1rem}
    .erro {color:#a22b2b;background:#fee2e2;border-radius:7px;padding:10px}
    small {display:block;color:#617187;margin-top:20px}
  </style>
</head>
<body>
  <main>
    <h1>Internet dos Coisos</h1>
    <p>Protótipo acadêmico · acesso do cuidador</p>
    {% if erro %}<div class="erro" role="alert">{{ erro }}</div>{% endif %}
    <form method="post" action="{{ url_for('login') }}">
      <label for="usuario">Usuário</label>
      <input id="usuario" name="usuario" autocomplete="username" required autofocus>
      <label for="senha">Senha</label>
      <input id="senha" name="senha" type="password" autocomplete="current-password" required>
      <button type="submit">Entrar no monitoramento</button>
    </form>
    <small>Sem valor clínico. Sinais simulados no Wokwi.</small>
  </main>
</body>
</html>
